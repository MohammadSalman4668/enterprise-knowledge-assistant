spring.application.name=enterprise-knowledge-assistant


# Optional, git-ignored file for local secrets (e.g. spring.datasource.password=...).
spring.config.import=optional:file:./local.properties

# ---- Database (PostgreSQL) -------------------------------------------------
spring.datasource.url=${EKG_DB_URL:jdbc:postgresql://localhost:5432/ekg}
spring.datasource.username=${EKG_DB_USER:ekg_app}
spring.datasource.password=${EKG_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---- Uploads ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
ekg.ingestion.max-bytes=5242880
# Chunks of 350-400 approximate tokens (not characters) with ~50 tokens of overlap inside a section.
# Split preference: headings, then paragraphs, then sentences; headings stay in the chunk text.
ekg.ingestion.chunk-min-tokens=350
ekg.ingestion.chunk-max-tokens=400
ekg.ingestion.chunk-overlap-tokens=50
ekg.ingestion.chunk-tokenizer=approximate

# ---- Retrieval ------------------------------------------------------------
# Keyword and semantic search run in parallel; the first semantic query also loads the embedding model.
ekg.retrieval.timeout=10s
ekg.retrieval.default-limit=10

# ---- Agent guard-rails -----------------------------------------------------
ekg.agent.max-tool-calls=10
ekg.agent.min-coverage=0.6
# Passages read per sub-question: 3, because the right document is sometimes ranked 3rd for paraphrased questions.
ekg.agent.reads-per-sub-question=3
ekg.agent.max-sub-questions=3

# ---- Model (local Ollama) ------------------------------------------------
# Free local model served by Ollama (https://ollama.com): `ollama pull qwen2.5:3b`.
# ollama = use the local model; simulated = no model at all (deterministic, clearly labelled).
# If Ollama is not reachable, answers fall back to the simulation and are marked "degraded".
ekg.llm.provider=${EKG_LLM_PROVIDER:ollama}
ekg.llm.base-url=${EKG_LLM_BASE_URL:http://localhost:11434/v1}
ekg.llm.model=${EKG_LLM_MODEL:qwen2.5:3b}
# Local models on a CPU are slow; allow time for each model call.
ekg.llm.timeout=120s
ekg.llm.max-tokens=1024

# ---- Semantic search (local Ollama embeddings) ------------------------------
# `ollama pull nomic-embed-text`. Vectors are stored in PostgreSQL (REAL[]) and compared in Java.
# If the embedding model is unavailable, search continues keyword-only and says so.
ekg.embedding.enabled=${EKG_EMBEDDING_ENABLED:true}
ekg.embedding.model=${EKG_EMBEDDING_MODEL:nomic-embed-text}
ekg.embedding.base-url=${EKG_EMBEDDING_BASE_URL:http://localhost:11434/v1}
ekg.embedding.timeout=60s
# Calibrated with nomic-embed-text on the seed corpus with 350-400-token chunks: questions that a document answers
# scored 0.64-0.73 against it (paraphrases included); unrelated questions scored up to 0.64. 0.635 keeps every
# answerable test question; an unrelated passage that slips through is still checked by the answer validator.
ekg.embedding.min-similarity=0.635
ekg.embedding.query-prefix=search_query:
ekg.embedding.document-prefix=search_document:
ekg.embedding.batch-size=16
ekg.embedding.async-indexing=true

# ---- Seed / demo -----------------------------------------------------------
ekg.seed.enabled=true
# The bootstrap Admin (approves HR and Admin sign-ups). Personal details and password are NOT
# committed: set ekg.admin.name, ekg.admin.email and ekg.admin.password in local.properties.
ekg.admin.name=${EKG_ADMIN_NAME:}
ekg.admin.email=${EKG_ADMIN_EMAIL:}
ekg.admin.password=${EKG_ADMIN_PASSWORD:}
