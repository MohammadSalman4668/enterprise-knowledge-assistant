spring.application.name=enterprise-knowledge-assistant

# Optional, git-ignored file for local secrets (e.g. spring.datasource.password=...).
spring.config.import=optional:file:./local.properties

# ---- Database (PostgreSQL) -------------------------------------------------
spring.datasource.url=${EKG_DB_URL:jdbc:postgresql://localhost:5432/ekg}
spring.datasource.username=${EKG_DB_USER:ekg_app}
spring.datasource.password=${EKG_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---- Uploads ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
ekg.ingestion.max-bytes=5242880
ekg.ingestion.chunk-size=800

# ---- Retrieval ------------------------------------------------------------
ekg.retrieval.timeout=3s
ekg.retrieval.default-limit=10

# ---- Agent guard-rails -----------------------------------------------------
ekg.agent.max-tool-calls=8
ekg.agent.min-coverage=0.6
ekg.agent.reads-per-sub-question=2
ekg.agent.max-sub-questions=3

# ---- Model -----------------------------------------------------------------
# auto = live Anthropic model when ANTHROPIC_API_KEY is set, otherwise the labelled simulation.
ekg.llm.provider=${EKG_LLM_PROVIDER:auto}
ekg.llm.api-key=${ANTHROPIC_API_KEY:}
ekg.llm.model=${EKG_LLM_MODEL:claude-sonnet-5-5}
ekg.llm.timeout=15s
ekg.llm.max-tokens=1024

# ---- Seed / demo -----------------------------------------------------------
ekg.seed.enabled=true
# Shared password for the four synthetic demo users. If unset, a random one is generated and logged at startup.
ekg.demo.password=${EKG_DEMO_PASSWORD:}
