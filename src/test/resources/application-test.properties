# Integration tests run against a real PostgreSQL database (ekg_test), never the app database.
spring.datasource.url=${EKG_TEST_DB_URL:jdbc:postgresql://localhost:5432/ekg_test}
# Each test resets the schema with Flyway clean + migrate, then re-seeds the corpus.
spring.flyway.clean-disabled=false
ekg.seed.enabled=false
# Tests are deterministic: never call a model, even if Ollama is running on the machine.
ekg.llm.provider=simulated
ekg.llm.timeout=1s
ekg.retrieval.timeout=2s
logging.level.com.salman.ekg=INFO
# Semantic search uses a deterministic fake embedding model in tests (FakeEmbeddingConfig), never Ollama.
ekg.embedding.async-indexing=false
ekg.embedding.scheduled-backfill=false
# The fake embedder (a hashed bag of words) scores far lower than nomic-embed-text on 350-400-token chunks
# (paraphrase 0.25 vs unrelated 0.12 on the seed corpus), so its threshold is lower.
ekg.embedding.min-similarity=0.20
# Synthetic bootstrap admin for tests (password empty: a random one is generated; tests use mock users).
ekg.admin.name=Test Admin
ekg.admin.email=admin@example.test
ekg.admin.password=
